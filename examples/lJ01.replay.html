  return LINE_STARTS[line - 1] + (col - 1);
}

/* ── Escape HTML ─────────────────────────────────────────────────────────── */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ── Build step list ─────────────────────────────────────────────────────── */
(function buildStepList() {
  const container = document.getElementById('steps');
  REPLAY.steps.forEach((step, idx) => {
    const participants = step.highlights
      .filter(h => h.role === 'participant')
      .map(h => h.name);
    const uniq = [...new Set(participants)];
    const div = document.createElement('div');
    div.className = 'step';
    div.dataset.idx = idx;
    div.innerHTML =
      `<span class="step-num">${step.step}</span>` +
      `<div class="step-body">` +
        `<div class="step-event">${esc(step.event)}</div>` +
        (uniq.length ? `<div class="step-who">${esc(uniq.join(' + '))}</div>` : '') +
      `</div>`;
    div.addEventListener('click', () => selectStep(idx));
    container.appendChild(div);
  });

  // Deadlock row subtitle
  const names = REPLAY.deadlock
    .filter(d => d.acceptance && d.acceptance.length > 0)
    .map(d => d.name);
  document.getElementById('deadlock-who').textContent =
    names.length ? names.join(', ') + ' waiting' : 'all stuck';

  document.getElementById('deadlock-row').addEventListener('click', () => selectStep(-1));
})();

/* ── Render highlighted source ──────────────────────────────────────────── */
function renderSource(highlights) {
  // 0 = none, 1 = bystander, 2 = participant
  const ann = new Uint8Array(SOURCE.length);

  for (const h of highlights) {
    if (h.line === undefined || h.role === 'dormant') continue;
    const code = h.role === 'participant' ? 2 : 1;
    const start = charOff(h.line, h.col);
    const end   = charOff(h.end_line, h.end_col);
    for (let i = Math.max(0, start); i < Math.min(end, SOURCE.length); i++) {
      if (ann[i] < code) ann[i] = code;
    }
  }

  const cls = ['', 'hl-b', 'hl-p'];
  let html = '';
  let lineNum = 1;
  let lineBody = '';
  let curCode = -1;

  function push(ch, code) {
    if (code !== curCode) {
      if (curCode > 0) lineBody += '</span>';
      curCode = code;
      if (code > 0) lineBody += `<span class="${cls[code]}">`;
    }
    lineBody += esc(ch);
  }

  function flushLine() {
    if (curCode > 0) lineBody += '</span>';
    curCode = -1;
    html += `<div class="src-line"><span class="ln">${lineNum++}</span>` +
            `<span class="lb">${lineBody || ' '}</span></div>`;
    lineBody = '';
  }

  for (let i = 0; i < SOURCE.length; i++) {
    const ch = SOURCE[i];
    if (ch === '\n') { flushLine(); } else { push(ch, ann[i]); }
  }
  if (lineBody || lineNum <= SRC_LINES.length) flushLine();

  document.getElementById('source-pre').innerHTML = html;
}

/* ── Update info panel ─────────────────────────────────────────────────── */
function renderInfo(idx) {
  const infoEl = document.getElementById('info');
  let highlights, title;

  if (idx === -1) {
    highlights = REPLAY.deadlock.map(d => ({...d, role: d.acceptance.length ? 'participant' : 'dormant'}));
    title = '✕ Deadlock reached';
  } else {
    const step = REPLAY.steps[idx];
    highlights = step.highlights;
    title = `Step ${step.step} / ${REPLAY.steps.length}: '${step.event}'`;
  }

  const roleClass = { participant: 'comp-participant', bystander: 'comp-bystander', dormant: 'comp-dormant' };
  const rows = highlights.map(h => {
    const loc = h.line ? ` <span style="color:#555">L${h.line}:${h.col}</span>` : '';
    return `<div class="${roleClass[h.role] || ''}">  ${esc(h.role[0].toUpperCase())} ${esc(h.name)}${loc}</div>`;
  }).join('');

  infoEl.innerHTML = `<div class="info-title">${esc(title)}</div>${rows}`;
}

/* ── Auto-scroll toggle ─────────────────────────────────────────────────── */
let autoScroll = true;

document.getElementById('scroll-toggle').addEventListener('click', () => {
  autoScroll = !autoScroll;
  const btn = document.getElementById('scroll-toggle');
  btn.setAttribute('aria-pressed', autoScroll);
  btn.textContent = autoScroll ? 'Auto-scroll' : 'No scroll';
});

/* ── Scroll source to first participant ─────────────────────────────────── */
function scrollToHighlight(highlights) {
  if (!autoScroll) return;

  const first = highlights.find(h => h.role === 'participant' && h.line !== undefined);
  if (!first) return;

  const right  = document.getElementById('right');
  const pre    = document.getElementById('source-pre');
  const lineEl = pre.children[first.line - 1];
  if (!lineEl) return;

  const rRect = right.getBoundingClientRect();
  const lRect = lineEl.getBoundingClientRect();

  let newTop  = right.scrollTop;
  let newLeft = right.scrollLeft;
  let changed = false;

  // Vertical — only move if the line is outside the visible area.
  if (lRect.top < rRect.top + 4) {
    newTop += lRect.top - rRect.top - 24;
    changed = true;
  } else if (lRect.bottom > rRect.bottom - 4) {
    newTop += lRect.bottom - rRect.bottom + 24;
    changed = true;
  }

  // Horizontal — find the highlighted span and only move if it is off-screen.
  // We never reset scrollLeft when the highlight is already in view.
  const hlSpan = lineEl.querySelector('.hl-p');
  if (hlSpan) {
    const hRect = hlSpan.getBoundingClientRect();
    const pad = 64;  // breathing room left/right
    if (hRect.right > rRect.right - pad) {
      // Off-screen to the right: scroll right just enough.
      newLeft += hRect.right - rRect.right + pad;
      changed = true;
    } else if (hRect.left < rRect.left + 54) {
      // Off-screen to the left (behind the line-number gutter): scroll left.
      newLeft = Math.max(0, newLeft + hRect.left - rRect.left - pad);
      changed = true;
    }
    // In view horizontally: leave scrollLeft exactly as it is.
  }

  if (changed) right.scrollTo({ top: newTop, left: newLeft, behavior: 'smooth' });
}

/* ── Select a step ─────────────────────────────────────────────────────── */
let currentIdx = null;

function selectStep(idx) {
  currentIdx = idx;

  // Update step list active state
  document.querySelectorAll('.step').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  document.getElementById('deadlock-row').classList.toggle('active', idx === -1);

  // Scroll the step into view in the left panel
  if (idx >= 0) {
    const stepEls = document.querySelectorAll('.step');
    if (stepEls[idx]) stepEls[idx].scrollIntoView({ block: 'nearest' });
  }

  let highlights;
  if (idx === -1) {
    highlights = REPLAY.deadlock.map(d => ({...d, role: d.acceptance.length ? 'participant' : 'dormant'}));
  } else {
    highlights = REPLAY.steps[idx].highlights;
  }

  renderSource(highlights);
  scrollToHighlight(highlights);
  renderInfo(idx);
}

/* ── Keyboard navigation ────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  const total = REPLAY.steps.length;
  const first = total > 0 ? 0 : -1;
  if (e.key === 's' || e.key === 'S') {
    document.getElementById('scroll-toggle').click();
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (currentIdx === null)        selectStep(first);
    else if (currentIdx < total - 1) selectStep(currentIdx + 1);
    else if (currentIdx !== -1)     selectStep(-1);
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    if (currentIdx === null || currentIdx === -1) selectStep(total > 0 ? total - 1 : -1);
    else if (currentIdx > 0) selectStep(currentIdx - 1);
    else selectStep(-1);
  } else if (e.key === 'Home') {
    e.preventDefault();
    selectStep(first);
  } else if (e.key === 'End') {
    e.preventDefault();
    selectStep(-1);
  }
});

/* ── Initial render ─────────────────────────────────────────────────────── */
renderSource([]);
selectStep(REPLAY.steps.length > 0 ? 0 : -1);
</script>
</body>
</html>
